name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build, audit, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: npm install

      # www/index.html is generated. Everything after this point inspects the
      # artefact that would ship, not the sources it came from.
      - name: Build web bundle
        run: npm run build

      - name: Static audit (versions, secrets, tier + skin data, dead code)
        run: npm run audit

      - name: Logic tests (tier policy, skins, save sanitiser, persistence)
        run: npm run test:logic

      # The browser harness needs a real rendering loop, so it is checked in for
      # manual runs (`npm run harness`) rather than wired into CI.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dead-zone-web
          path: www/index.html
          if-no-files-found: error
