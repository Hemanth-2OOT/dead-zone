name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build web bundle
        run: node src_v2/build.js

      # A release must never ship a tree that fails its own audit. The audit checks
      # that the version in package.json, engine_bootstrap.js and build.gradle
      # agree, that no signing material is tracked, that the weapon tiers and skin
      # indices are consistent, and that nothing is dead.
      - name: Audit and logic tests
        run: npm run test:logic && npm run audit

      - run: npm install
      - run: npx cap sync android

      # The keystore is not in the repository. It is stored base64-encoded in the
      # RELEASE_KEYSTORE_BASE64 secret and materialised only inside the runner.
      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not configured; refusing to publish an unsigned release."
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Assemble signed release APK
        env:
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease

      # Fail the release rather than quietly shipping a debug-signed or unsigned APK.
      - name: Verify the APK is signed with the release key
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::release APK was not produced"; exit 1; }
          ls -l "$APK"
          BT=$(ls -d "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK"

      - name: Stage artifacts
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "dead-zone-${GITHUB_REF_NAME}.apk"
          # Source archive straight from the tagged commit, so it can never contain
          # build output, node_modules or the keystore.
          git archive --format=zip --prefix="dead-zone-${GITHUB_REF_NAME}/" \
            -o "dead-zone-${GITHUB_REF_NAME}-source.zip" "$GITHUB_REF_NAME"
          ls -l dead-zone-*

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dead-zone-*.apk
            dead-zone-*-source.zip
          generate_release_notes: true
