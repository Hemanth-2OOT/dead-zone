apply plugin: 'com.android.application'

// Release signing credentials are never committed. They are resolved, in order, from:
//   1. android/app/keystore.properties  (gitignored; for local release builds)
//   2. RELEASE_* environment variables   (CI, fed from repository secrets)
// Without either, `assembleRelease` falls back to the debug key so a local build
// still produces something installable, and warns loudly.
def keystoreProps = new Properties()
def keystorePropsFile = file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def signingValue = { String prop, String env -> keystoreProps.getProperty(prop) ?: System.getenv(env) }
def releaseStorePath = signingValue('storeFile', 'RELEASE_STORE_FILE')
def releaseStorePass = signingValue('storePassword', 'RELEASE_STORE_PASSWORD')
def releaseKeyAlias  = signingValue('keyAlias', 'RELEASE_KEY_ALIAS')
def releaseKeyPass   = signingValue('keyPassword', 'RELEASE_KEY_PASSWORD')
def hasReleaseSigning = releaseStorePath && releaseStorePass && releaseKeyAlias && releaseKeyPass
if (!hasReleaseSigning) {
    logger.warn('[dead-zone] No release signing credentials (keystore.properties or RELEASE_* env). ' +
                'Falling back to the debug keystore; this APK must not be published.')
}

android {
    namespace "com.deadzone.game"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.deadzone.game"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 31
        versionName "2.11.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStorePath)
                storePassword releaseStorePass
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPass
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/*.version', 'META-INF/services/kotlinx.coroutines.*', 'META-INF/com/android/build/gradle/app-metadata.properties']
        }
    }
    buildTypes {
        release {
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
